name: Github Action Deploy
on: push

jobs:
  build:
    runs-on: macos-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Nodejs v18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Package
        run: |
          npm install pnpm -g
          pnpm i
          pnpm run build

      - name: Deploy to github-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.SSH }}
          publish_dir: ./dist
