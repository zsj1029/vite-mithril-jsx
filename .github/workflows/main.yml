name: Github Action Deploy
on:
  push:
    branches: ["master"]
    paths-ignore:
      - "readme.md"
      - ".env"
      - ".gitignore"
      - ".gitmodules"
      - "bin"

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Nodejs v18
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build Package
        run: |
          yarn install
          npm run build

      # - name: Upload artifact
      #   uses: actions/upload-pages-artifact@v1
      #   with:
      #     path: ./dist

  deploy:
    runs-on: macos-latest
    # environment:
    #   name: github-pages
    #   url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
